apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v1
  labels:
    app: invoice-system
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-system
      version: v1
  template:
    metadata:
      labels:
        app: invoice-system
        version: v1
  spec:
    containers:
    - name: invoice-app
      image: sanguptha/invoice-system:v1
      imagePullPolicy: Always
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v1-service
spec:
  type: NodePort
  selector:
    app: invoice-system
    version: v1
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001