apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v2
  labels:
    app: invoice-system
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-system
      version: v2
  template:
    metadata:
      labels:
        app: invoice-system
        version: v2
  spec:
    containers:
    - name: invoice-app
      image: sanguptha/invoice-system:v2
      imagePullPolicy: Always
      env:
      - name: APP_VERSION
        value: "v2"
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v2-service
spec:
  type: NodePort
  selector:
    app: invoice-system
    version: v2
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30002
