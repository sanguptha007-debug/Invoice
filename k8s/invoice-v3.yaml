apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v3
  labels:
    app: invoice-system
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-system
      version: v3
  template:
    metadata:
      labels:
        app: invoice-system
        version: v3
    spec:
      containers:
        - name: invoice-app
          image: sanguptha/invoice-system:v3
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: v3
            - name: APP_PORT
              value: "8080"
            - name: DATA_FILE
              value: /data/invoices.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: invoice-data
              mountPath: /data
      volumes:
        - name: invoice-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v3-service
  labels:
    app: invoice-system
    version: v3
spec:
  type: NodePort
  selector:
    app: invoice-system
    version: v3
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30083
