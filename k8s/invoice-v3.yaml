apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v3
  labels:
    app: invoice-system
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-system
      version: v3
  template:
    metadata:
      labels:
        app: invoice-system
        version: v3
  spec:
    containers:
    - name: invoice-app
      image: sanguptha/invoice-system:v3
      imagePullPolicy: Always
      env:
      - name: APP_VERSION
        value: "v3"
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v3-service
spec:
  type: NodePort
  selector:
    app: invoice-system
    version: v3
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30003
